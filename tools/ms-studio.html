<meta charset="utf-8">
<title>MS 生成器（設計師端）</title>
<!-- 載入順序契約：tokens.css → xd-core → atoms → flow-engine → workorder → export-png → packs → 頁面腳本 -->
<link rel="stylesheet" href="../core/tokens.css">
<link rel="stylesheet" href="../core/ui.css">
<link rel="stylesheet" href="../core/paper.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../core/xd-core.js"></script>
<script src="../core/atoms.js"></script>
<script src="../core/flow-engine.js"></script>
<script src="../core/workorder.js"></script>
<script src="../core/export-png.js"></script>
<script src="../packs/ms/presets.js"></script>
<style>
/* ===== 本頁專屬（共用外殼在 core/ui.css） ===== */
main{grid-template-columns:330px 1fr}
#panel{background:var(--ui-panel);border-right:1px solid var(--ui-line);overflow-y:auto;padding:14px}
#panel h2{font-size:12px;color:var(--ui-dim);margin:16px 0 8px;font-weight:700;letter-spacing:.04em}
#panel h2:first-child{margin-top:0}
#report{font-size:12.5px;line-height:1.7;background:var(--ui-surface);border:1px solid var(--ui-line2);
        border-radius:10px;padding:10px 12px;color:var(--ui-dim)}
#report b.ok{color:var(--ui-success)}#report b.warn{color:var(--ui-warn)}#report b.bad{color:var(--ui-danger)}
#report ul{margin:4px 0 0;padding-left:18px;color:var(--ui-dim2)}
#matches .m{display:flex;flex-direction:column;gap:4px;border:1px solid var(--ui-line2);border-radius:10px;
            padding:8px 10px;margin-bottom:8px;font-size:12.5px;background:var(--ui-surface)}
#matches .m .nm{font-weight:700;color:var(--ui-text)}
#matches .m .why{color:var(--ui-dim);font-size:11.5px}
#matches .m .why.manual{color:var(--ui-warn)}
#matches select{width:100%;font-size:12px;padding:4px 6px;height:auto}
#matches img.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--ui-line2)}
#matches .row1{display:flex;gap:8px;align-items:center}
#stage{overflow:auto;padding:28px 28px 80px;cursor:default}
#zoomwrap{margin:0 auto}

/* ===== 產出物（本體樣式在 core/paper.css，這裡只加工具自己的裝飾） ===== */
.paper{box-shadow:0 8px 40px rgba(0,0,0,.22)}
#emptyPage{border:3px dashed var(--ui-line2);border-radius:18px;padding:120px 60px;text-align:center;
           color:var(--ui-dim);width:1200px;background:var(--ui-panel)}
#emptyPage b{display:block;font-size:30px;margin-bottom:10px;color:var(--ui-text)}
</style>

<header>
  <a class="btn" href="../index.html" title="回到工具選擇頁">← 首頁</a>
  <h1>MS 生成器<small>設計師端｜匯入工單＋素材包 → 產出活動頁</small></h1>
  <label class="btn">📄 開啟工單 xlsx<input type="file" id="fXlsx" accept=".xlsx"></label>
  <label class="btn">🖼 加入素材包（整個資料夾）<input type="file" id="fDir" webkitdirectory multiple></label>
  <label class="btn">＋零散圖片<input type="file" id="fImgs" accept="image/*" multiple></label>
  <select id="zoom">
    <option value=".45" selected>45%</option><option value=".55">55%</option>
    <option value=".75">75%</option><option value="1">100%</option>
  </select>
  <span class="spacer"></span>
  <button id="btnPng">⬇ 整張 PNG</button>
  <button class="primary" id="btnZip">⬇ 分段切圖 ZIP</button>
</header>

<main>
  <aside id="panel">
    <h2>匯入報告</h2>
    <div id="report"><span class="hint">先開啟蝦大填好的工單 xlsx。</span></div>
    <h2>圖片配對（素材包 → 照片格）</h2>
    <div id="matches"><span class="hint">匯入工單後，選整個素材包資料夾（或直接把資料夾拖進視窗），系統會依「指定檔名 → 名稱 → 序號 → 順序」自動配對，配錯可手動改。非圖片檔會自動略過。</span></div>
  </aside>
  <section id="stage"><div id="zoomwrap"><div id="paper" class="paper"></div></div></section>
</main>

<footer>
  <span>工單須為 ms-editor 產出的版型（XIADA_WORKORDER_V1）</span>
  <span>照片配對規則：綠格指定檔名 &gt; 檔名含姓名/品牌 &gt; 檔名序號 &gt; 檔名排序遞補</span>
</footer>
<div id="msg"></div>

<script>
(function () {
  'use strict';
  const XD = window.XD, $ = XD.$, esc = XD.esc;
  const PACK = XD.packs.ms, SDEFS = PACK.sections, PRESETS = PACK.presets;

  let PAGE = null;          /* 匯入重建的頁面 */
  let SLOTS = [];           /* 照片格 [{key,label,want,atom}] */
  let ASSETS = [];          /* 素材 [{name,base,dataUrl}] */
  let IMPORTED = null;      /* parse 結果 */

  const norm = s => String(s || '').toLowerCase().replace(/\.[a-z0-9]+$/i, '')
                    .replace(/[\s　_\-]+/g, '');

  /* ============ 渲染（唯讀） ============ */
  function render() {
    const paper = $('#paper');
    if (!PAGE) {
      paper.innerHTML = '<div id="emptyPage"><b>還沒有內容</b><span>開啟蝦大填好的工單 xlsx，就會在這裡重建整頁</span></div>';
      applyZoom(); return;
    }
    const nonKv = PAGE.sections.filter(s => !SDEFS[s.type].kv);
    paper.innerHTML = PAGE.sections.map(sec => {
      const sdef = SDEFS[sec.type];
      const i = nonKv.indexOf(sec);
      const no = sdef.kv ? 'KV' : 'MS_' + String(i + 1).padStart(2, '0');
      return '<div class="sec' + (sdef.kv ? ' kv' : '') + '" data-iid="' + sec.iid + '">' +
        '<div class="msno">' + no + '</div>' +
        XD.flow.sectionBodyHTML(sec, sdef, PRESETS, { editable: false }) + '</div>';
    }).join('');
    applyZoom();
  }
  function applyZoom() {
    const z = +$('#zoom').value;
    $('#paper').style.transform = 'scale(' + z + ')';
    $('#zoomwrap').style.width = Math.max(1200 * z, 400) + 'px';
    $('#zoomwrap').style.height = ($('#paper').offsetHeight * z) + 'px';
  }
  $('#zoom').onchange = applyZoom;

  /* ============ 匯入工單 ============ */
  async function importBuffer(buf) {
    IMPORTED = await XD.workorder.parseXlsx(buf, PRESETS, SDEFS);
    PAGE = IMPORTED.page;
    collectSlots();
    render(); paintReport(); matchAndPaint();
    XD.toast('工單匯入完成：' + IMPORTED.applied + ' / ' + IMPORTED.total + ' 個欄位有內容');
    return IMPORTED;
  }
  $('#fXlsx').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await importBuffer(await f.arrayBuffer()); }
    catch (err) { console.error(err); XD.toast('匯入失敗：' + err.message); }
    e.target.value = '';
  };

  function paintReport() {
    if (!IMPORTED) return;
    const r = IMPORTED;
    const nMiss = r.missing.length, nWarn = r.warnings.length;
    $('#report').innerHTML =
      '<b class="ok">✓ 已匯入 ' + r.applied + ' 個欄位</b>（共 ' + r.total + ' 格）<br>' +
      (nMiss ? '<b class="warn">△ 未填 ' + nMiss + ' 格</b>（預覽以假字顯示）' : '<b class="ok">✓ 全部填寫</b>') +
      (nMiss ? '<ul>' + r.missing.slice(0, 8).map(m => '<li>' + esc(m.nm) + '</li>').join('') +
               (nMiss > 8 ? '<li>…共 ' + nMiss + ' 格</li>' : '') + '</ul>' : '') +
      (nWarn ? '<br><b class="bad">✕ 結構警告 ' + nWarn + ' 項</b><ul>' +
               r.warnings.slice(0, 5).map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>' : '');
  }

  /* ============ 照片格與配對 ============ */
  /* 走訪一列裡所有 atom 群組：lead 格、一般格、以及子網格的每個子格。
     圖片欄不再只認 photo——icon／pic 也是檔名欄（XD.ATOMS 上的 photo 旗標）。 */
  const isImgAtom = t => !!(XD.ATOMS[t] || {}).photo;
  const groupsOf = row => (row.lead ? [row.lead] : []).concat(row.cells || [])
    .map(c => c.sub ? c.sub.map(s => s.atoms || []) : [c.atoms || []])
    .reduce((a, b) => a.concat(b), []);
  const nameIn = g => (g.find(a => a.t === 'cname' || a.t === 'head') || {}).v || '';

  function collectSlots() {
    SLOTS = [];
    PAGE.sections.forEach(sec => sec.rows.forEach(row => {
      const groups = groupsOf(row);
      /* 配對用的標籤：優先取同一格/同一子格裡的名稱欄（並排小卡三張各有各的名字），
         同格沒有才退回整列的第一個名稱欄。 */
      const rowName = groups.map(nameIn).find(Boolean) || '';
      groups.forEach(g => {
        const own = nameIn(g);
        g.forEach(atom => {
          if (!isImgAtom(atom.t)) return;
          const kind = (XD.ATOMS[atom.t].nm || '圖片').replace('檔名', '');
          SLOTS.push({ key: 'p' + SLOTS.length,
                       label: own || rowName || (kind + '格 ' + (SLOTS.length + 1)),
                       want: atom.v || '', atom });
        });
      });
    }));
  }

  function autoMatch() {
    const used = new Set();
    SLOTS.forEach(s => { s.match = null; s.why = ''; });
    /* 1. 綠格指定檔名 */
    SLOTS.forEach(s => {
      if (!s.want) return;
      const w = norm(s.want);
      const f = ASSETS.find(a => !used.has(a) && (a.base === w || norm(a.name) === w));
      if (f) { s.match = f; s.why = '指定檔名'; used.add(f); }
    });
    /* 2. 檔名含姓名/品牌（或反向） */
    SLOTS.forEach(s => {
      if (s.match) return;
      const segs = String(s.label).split(/[-‧·．\/｜|]/).map(norm).filter(x => x.length >= 2);
      const whole = norm(s.label);
      const f = ASSETS.find(a => !used.has(a) &&
        (segs.some(g => a.base === g || a.base.indexOf(g) >= 0 || g.indexOf(a.base) >= 0) ||
         (whole && (a.base.indexOf(whole) >= 0 || whole.indexOf(a.base) >= 0))));
      if (f) { s.match = f; s.why = '名稱比對'; used.add(f); }
    });
    /* 3. 檔名序號 → 第 n 個照片格 */
    ASSETS.forEach(a => {
      if (used.has(a)) return;
      const m = a.base.match(/(\d+)$/); if (!m) return;
      const slot = SLOTS[parseInt(m[1], 10) - 1];
      if (slot && !slot.match) { slot.match = a; slot.why = '序號'; used.add(a); }
    });
    /* 4. 剩餘照檔名排序遞補 */
    const rest = ASSETS.filter(a => !used.has(a)).sort((x, y) => x.name.localeCompare(y.name, 'zh-Hant'));
    SLOTS.forEach(s => { if (!s.match && rest.length) { s.match = rest.shift(); s.why = '順序遞補'; } });
  }

  function applyMatches() {
    SLOTS.forEach(s => { s.atom.img = s.match ? s.match.dataUrl : null; });
    render();
  }

  function matchAndPaint() {
    if (!SLOTS.length) {
      $('#matches').innerHTML = '<span class="hint">這份工單沒有照片格。</span>'; return;
    }
    if (ASSETS.length) autoMatch();
    applyMatches();
    $('#matches').innerHTML = SLOTS.map((s, i) => {
      const opts = ['<option value="">（不使用）</option>'].concat(ASSETS.map((a, ai) =>
        '<option value="' + ai + '"' + (s.match === a ? ' selected' : '') + '>' + esc(a.name) + '</option>'));
      return '<div class="m"><div class="row1">' +
        (s.match ? '<img class="thumb" src="' + s.match.dataUrl + '">' : '') +
        '<div><div class="nm">' + esc(s.label) + '</div>' +
        (s.want ? '<div class="why">綠格指定：' + esc(s.want) + '</div>' : '') +
        '<div class="why' + (s.why === '手動' ? ' manual' : '') + '">' +
        (s.match ? '依據：' + s.why : (ASSETS.length ? '⚠ 沒配到' : '尚未加入素材包')) + '</div></div></div>' +
        '<select data-slot="' + i + '">' + opts.join('') + '</select></div>';
    }).join('');
  }
  $('#matches').addEventListener('change', e => {
    const sel = e.target.closest('select[data-slot]'); if (!sel) return;
    const s = SLOTS[+sel.dataset.slot];
    s.match = sel.value === '' ? null : ASSETS[+sel.value];
    s.why = '手動';
    applyMatches(); matchAndPaint();
  });

  const IMG_RE = /\.(png|jpe?g|webp|gif|bmp)$/i;
  async function addAssetFiles(files) {
    let skipped = 0;
    for (const f of files) {
      if (!(f.type && f.type.indexOf('image/') === 0) && !IMG_RE.test(f.name)) { skipped++; continue; }
      const dataUrl = await new Promise(res => {
        const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f);
      });
      const dup = ASSETS.findIndex(a => a.name === f.name);   /* 同名重加 = 蓋掉 */
      if (dup >= 0) ASSETS[dup].dataUrl = dataUrl;
      else ASSETS.push({ name: f.name, base: norm(f.name), dataUrl });
    }
    matchAndPaint();
    XD.toast('素材包共 ' + ASSETS.length + ' 張圖' + (skipped ? '（略過 ' + skipped + ' 個非圖片檔）' : ''));
  }
  $('#fImgs').onchange = e => { addAssetFiles(Array.from(e.target.files)); e.target.value = ''; };
  $('#fDir').onchange  = e => { addAssetFiles(Array.from(e.target.files)); e.target.value = ''; };

  /* 整包拖進來（資料夾或多檔都收；xlsx 一併當工單匯入） */
  async function filesFromDataTransfer(dt) {
    const out = [];
    const walk = entry => new Promise(res => {
      if (!entry) return res();
      if (entry.isFile) entry.file(f => { out.push(f); res(); }, () => res());
      else if (entry.isDirectory) {
        const rd = entry.createReader();
        const readAll = () => rd.readEntries(async ents => {
          if (!ents.length) return res();
          for (const e of ents) await walk(e);
          readAll();
        }, () => res());
        readAll();
      } else res();
    });
    if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
      const entries = Array.from(dt.items).map(i => i.webkitGetAsEntry()).filter(Boolean);
      for (const e of entries) await walk(e);
      if (out.length) return out;
    }
    return Array.from(dt.files || []);
  }
  ['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('drop', async e => {
    const files = await filesFromDataTransfer(e.dataTransfer);
    if (!files.length) return;
    if (e.target.closest && e.target.closest('[data-kv]')) {        /* 拖到 KV 區 = 換 KV 圖 */
      const img = files.find(f => (f.type || '').indexOf('image/') === 0 || IMG_RE.test(f.name));
      if (img) return setKvFile(img);
    }
    const xlsx = files.find(f => /\.xlsx$/i.test(f.name));
    if (xlsx) {
      try { await importBuffer(await xlsx.arrayBuffer()); }
      catch (err) { console.error(err); XD.toast('匯入失敗：' + err.message); }
    }
    const rest = files.filter(f => f !== xlsx);
    if (rest.length) addAssetFiles(rest);
  });

  /* ============ KV 圖片（點選或拖入） ============ */
  const fKv = document.createElement('input');
  fKv.type = 'file'; fKv.accept = 'image/*'; fKv.style.display = 'none';
  document.body.appendChild(fKv);
  const kvSec = () => PAGE && PAGE.sections.find(s => SDEFS[s.type].kv);
  async function setKvFile(f) {
    const sec = kvSec(); if (!sec || !f) return;
    sec.kvImg = await new Promise(res => {
      const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f);
    });
    render(); XD.toast('KV 圖已放入');
  }
  fKv.onchange = e => { setKvFile(e.target.files[0]); e.target.value = ''; };
  $('#paper').addEventListener('click', e => {
    if (e.target.closest('.kvdel')) {
      const sec = kvSec(); if (sec) { sec.kvImg = null; render(); }
      return;
    }
    if (e.target.closest('[data-kv]')) fKv.click();
  });

  /* ============ 分段切圖 ZIP ============ */
  async function exportSlices() {
    if (!PAGE) { XD.toast('先匯入工單'); return null; }
    if (typeof JSZip === 'undefined') { XD.toast('JSZip 尚未載入（需要連網）'); return null; }
    const paper = $('#paper');
    paper.classList.add('export');
    const pageBg = getComputedStyle(document.documentElement).getPropertyValue('--c-page').trim() || '#2358E6';
    try {
      const zip = new JSZip();
      const secEls = Array.from(paper.querySelectorAll('.sec'));
      const names = [];
      let edm = 0;
      for (const el of secEls) {
        const sec = PAGE.sections.find(s => s.iid === el.dataset.iid);
        const isKv = SDEFS[sec.type].kv;
        const nm = isKv ? 'KV' : 'EDM' + (++edm);
        const r = await XD.captureNode(el, { type:'jpeg', quality:.92, width:1200,
                                             height: el.offsetHeight, background: pageBg });
        zip.file(nm + '.jpg', r.dataUrl.split(',')[1], { base64: true });
        names.push(nm + '.jpg（1200×' + r.height + '）');
      }
      zip.file('project.json', JSON.stringify({ sections: PAGE.sections, exportedAt: new Date().toISOString() }, null, 2));
      const blob = await zip.generateAsync({ type:'blob' });
      const fn = 'MS分段切圖_' + new Date().toISOString().slice(0, 10) + '.zip';
      XD.download(blob, fn);
      XD.toast('已匯出 ' + names.length + ' 張切圖：' + fn);
      window.__lastZip = { files: names, bytes: blob.size };
      return window.__lastZip;
    } catch (e) { console.error(e); XD.toast('切圖失敗：' + e.message); return null; }
    finally { paper.classList.remove('export'); applyZoom(); }
  }
  $('#btnZip').onclick = exportSlices;

  /* ============ 匯出 PNG ============ */
  $('#btnPng').onclick = async () => {
    if (!PAGE) return XD.toast('先匯入工單');
    const paper = $('#paper');
    paper.classList.add('export');
    try {
      const r = await XD.exportPng(paper, 'MS活動頁_' + new Date().toISOString().slice(0, 10) + '.png',
                                   { width: 1200, height: paper.offsetHeight });
      XD.toast('已匯出 PNG（1200 × ' + r.height + '）');
      window.__lastPng = r;
    } catch (e) { console.error(e); XD.toast('匯出失敗：' + e.message); }
    finally { paper.classList.remove('export'); applyZoom(); }
  };

  render();

  window.__api = {
    importBuffer, addAssetFiles, autoMatch, applyMatches,
    get PAGE() { return PAGE; }, get SLOTS() { return SLOTS; }, get ASSETS() { return ASSETS; },
    get IMPORTED() { return IMPORTED; },
    exportPng: () => $('#btnPng').onclick(),
    exportSlices, setKvFile,
  };
})();
</script>
<!-- 檔尾這個 body 結束標籤必須留著：VS Code Live Server（live-server 的 inject 中介層）
     會把 livereload 的 script 插在它找到的第一個結束標籤前面，候選順序是
     body -> svg -> head。本專案的 icon 是寫在 JS 字串裡的行內 SVG，檔案裡沒有 body
     結束標籤時它就會挑 svg 的，把一整段 HTML 插進 JS 字串中間 -> SyntaxError
     -> 整頁腳本不執行（2026-09-16 實測 live-server 5.7.10 / 擴充套件 ritwickdey.LiveServer）。
     註解裡刻意不寫出那幾個標籤的字面值，否則它會比真正的標籤更早被比對到。 -->
</body>
